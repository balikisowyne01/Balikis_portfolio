<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Circle Frame -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="160" fill="url(#glow)" />

  <!-- Data Grid Lines & Constellations in background -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="80" y1="200" x2="320" y2="200" />
    <line x1="200" y1="80" x2="200" y2="320" />
    <circle cx="200" cy="200" r="100" fill="none" />
  </g>

  <!-- Floating Data Nodes -->
  <circle cx="110" cy="130" r="4" fill="#38bdf8" />
  <circle cx="290" cy="120" r="5" fill="#10b981" />
  <circle cx="310" cy="220" r="3.5" fill="#f59e0b" />
  <circle cx="90" cy="230" r="4" fill="#818cf8" />
  <path d="M 110 130 L 150 90 L 200 110 L 290 120" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" fill="none" />

  <!-- Stylized Professional Female Silhouette with Hijab / Sleek Head Wrap / Profile Shape -->
  <g fill="#ffffff">
    <!-- Head wrap / Silhouette drape -->
    <path d="M 200 95 C 155 95 130 135 130 185 C 130 240 145 270 170 285 C 180 290 185 305 175 320 C 160 340 120 365 70 385 C 110 395 290 395 330 385 C 280 365 240 340 225 320 C 215 305 220 290 230 285 C 255 270 270 240 270 185 C 270 135 245 95 200 95 Z" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    
    <!-- Face Silhouette -->
    <path d="M 160 170 C 160 215 178 245 200 245 C 222 245 240 215 240 170 C 240 135 222 125 200 125 C 178 125 160 135 160 170 Z" fill="#e2e8f0" />
    
    <!-- Subtle glasses / analytical feature hint -->
    <g stroke="#0284c7" stroke-width="2.5" fill="none" opacity="0.9">
      <rect x="172" y="160" width="22" height="15" rx="4" />
      <rect x="206" y="160" width="22" height="15" rx="4" />
      <line x1="194" y1="167" x2="206" y2="167" />
    </g>

    <!-- Torso / Professional Blazer Lapel Accent -->
    <path d="M 145 320 L 200 390 L 255 320" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Initials Badge / Monogram -->
  <g transform="translate(200, 310)">
    <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="2" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
      NB • DATA
    </text>
  </g>
</svg>
